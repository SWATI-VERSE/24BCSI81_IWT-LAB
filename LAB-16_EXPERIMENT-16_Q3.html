<h3>3. Create three buttons: Red, Green, Blue. When a button is clicked, change the background color of a <div> accordingly. Before changing the color, ask confirmation from the user if they really want to change the background color.<h3>

<html>
	<head>
		<title>LAB-16_Q3</title>

		<script>
			function changeColor(color)
			{
				var res=confirm("Do you really want to change the background colour to "+color+"?");

				if (res==true)
				{
					document.getElementById("d1").style.backgroundColor=color;
				}
			}
		</script>

	</head>

	<body>

		<div id="d1" style="width:400px; height:200px; border:1px solid black;">
			CHANGE BACKGROUND COLOR
		</div>

		<br>

		<input type="button" value="Red" onclick="changeColor('red')">
		<input type="button" value="Green" onclick="changeColor('green')">
		<input type="button" value="Blue" onclick="changeColor('blue')">

	</body>
</html>
