//(18)Write a program to input a year and check whether it is leap year or not using nested if?

<html>
	<head>
		<title>JS-EXP-12-Q-18</title>
		<script language="JavaScript">
			var y=2018;
			document.write("<br>");
			if(y%100!=0)
				if(y%4==0)
					document.write("Leap Year..!!");
				else
					document.write("NOT A Leap Year..!!");
			else
				if(y%400==0)
					document.write("Leap Year..!!");
				else
					document.write("NOT A Leap Year..!!");
			</script>
	</head>
	
	<body bgcolor="orange" text="black">
	</body>
</html>
