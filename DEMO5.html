<html>
	<head>
		<title>DEMO-05</title>
		<script>
			const items=document.getElementsByTagName("li");
			for(let i=0;i<items.length;i++)
			{
				document.write(items[i].innerHTML);
			}
		</script>
	</head>
	
	<body>
		<ul>
			<li>APPLE</li>
			<li>BANANA</li>
			<li>CHERRY</li>
		</ul>
	</body>
</html>
