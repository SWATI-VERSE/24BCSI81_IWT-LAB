Write a program to find the factorial of a number using function?

<html> 
	<head>
		<title>array</title> 
		<script language="JavaScript"> 
		function factorial(n) 
		{ 
			var f=1;
			var i;
				while(n!=0) 
				{ 
					f=f*n; 
					n--; 
				}
			return(f); 
		} 
		document.write("<br>"+"Factorial Value= "+factorial(5)); 
		</script> 
	</head> 
	<body bgcolor="pink" text="black">
	</body> 
</html>
