<h3>6. WAP to remove duplicate elements from an array and print the new Array.</h3>

<html>
	<head>
		<title>LAB-13_ASS-05_Q-06</title>
		<script language="JavaScript">

		var a=new Array();
		var b=new Array();
		var n, i, j, found;

		n=parseInt(prompt("Enter number of elements of the array: "));

		for(i=0;i<n;i++)
		{
			a[i]=parseInt(prompt("Enter element "+(i+1)+":"));
		}
		
		console.log("Original Array: "+a);
		for(i=0;i<n;i++)
		{
			found=0;

			for(j=0;j<b.length;j++)
			{
				if(a[i]==b[j])
					found=1;
			}

			if(found==0)
				b[b.length]=a[i];
		}

		console.log("Array after removing duplicates: "+b);

		</script>
	</head>

	<body bgcolor="orange" text="black">
	</body>
</html>
