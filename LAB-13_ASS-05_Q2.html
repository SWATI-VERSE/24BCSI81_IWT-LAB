<h3>2. WAP using a for loop to calculate and print the factorial of a number.</h3>

<html>
	<head>
		<title>LAB-13_ASS-05_Q-02</title>

		<script language="JavaScript">

		var num, fact=1, i;

		num=parseInt(prompt("Enter a number:"));

		for(i=1;i<=num;i++)
		{
			fact=fact*i;
		}

		document.write("Factorial of "+num+" is: "+fact);

		</script>
	</head>
	
	<body bgcolor="lightblue" text="black">
	</body>
</html>
